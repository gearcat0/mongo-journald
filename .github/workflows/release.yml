name: release

# Cut a release by pushing a semver tag:
#   git tag v0.2.0 && git push origin v0.2.0
# GoReleaser then builds amd64 + arm64, packages the .deb files, and attaches
# them (plus raw binary tarballs and checksums.txt) to a GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

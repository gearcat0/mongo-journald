# nfpm packaging for mongo-journald — see https://nfpm.goreleaser.com
#
# Built per-arch by the Makefile, which sets ARCH and VERSION:
#   ARCH=amd64 VERSION=0.1.0 nfpm package -f nfpm.yaml -p deb -t dist
#
# The install steps (service user, state dir, env placeholder, enable)
# live in the maintainer scripts under debian/. The Mongo URI is NOT in
# the package: postinst writes a root-only 0600 placeholder env if absent,
# enables the unit, and leaves it stopped until the operator sets the URI.
name: mongo-journald
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: admin
priority: optional
maintainer: "mongo-journald maintainers <noreply@example.com>"
description: |
  Ship systemd-journald logs to MongoDB with TTL retention.
  A per-host daemon that streams journald entries into a MongoDB collection
  using the same schema and expireAt TTL technique as the mover's events
  log, so the same mongosh sweeps work against system logs.
homepage: https://github.com/gearcat0/mongo-journald
license: proprietary

# journalctl + systemctl come from systemd; the daemon shells out to both.
depends:
  - systemd

contents:
  # The Makefile copies the arch-matching binary to this fixed staging path
  # before each run (nfpm does not expand env vars inside contents.src).
  - src: dist/mongo-journald
    dst: /usr/bin/mongo-journald
    file_info:
      mode: 0755

  - src: mongo-journald.service
    dst: /lib/systemd/system/mongo-journald.service
    file_info:
      mode: 0644

  # Marked a conffile (config|noreplace): dpkg preserves local edits and
  # never clobbers it on upgrade. The credential env file is deliberately
  # NOT shipped here — postinst creates it.
  - src: config_sample.json
    dst: /etc/mongo-journald/config.json
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  postinstall: debian/postinst
  preremove: debian/prerm
  postremove: debian/postrm
